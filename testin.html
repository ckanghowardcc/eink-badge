
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quad-Color Badge Designer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f0e7;
      color: #222;
      margin: 0;
      padding: 24px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0;
    }

    button {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    button.active {
      background: #222;
      color: white;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 768px;
      height: auto;
      background: white;
      border: 2px solid #222;
      touch-action: none;
    }

    .colors {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }

    .color {
      width: 42px;
      height: 42px;
      border: 2px solid #888;
      border-radius: 5px;
    }

    .color.active {
      outline: 3px solid #555;
      outline-offset: 2px;
    }

    .workspace {
      max-width: 800px;
    }
  </style>
</head>

<body>
  <h1>Quad-Color Badge Designer</h1>
  <p class="subtitle">
    Design your e-ink badge · 384 × 180 pixels
  </p>

  <div class="workspace">
    <h3>Choose a screen</h3>

    <div class="toolbar" id="screens">
      <button class="active" data-screen="0">Screen 1</button>
      <button data-screen="1">Screen 2</button>
      <button data-screen="2">Screen 3</button>
    </div>

    <h3>Choose a tool</h3>

    <div class="toolbar" id="tools">
      <button class="active" data-tool="pen">Draw</button>
      <button data-tool="line">Line</button>
      <button data-tool="rect">Rectangle</button>
      <button data-tool="text">Text</button>
      <button data-tool="eraser">Eraser</button>
    </div>

    <h3>Choose a display color</h3>

    <div class="colors" id="colors">
      <button class="color active"
        data-color="#000000"
        style="background:#000000"
        aria-label="Black"></button>

      <button class="color"
        data-color="#FFFFFF"
        style="background:#FFFFFF"
        aria-label="White"></button>

      <button class="color"
        data-color="#FF0000"
        style="background:#FF0000"
        aria-label="Red"></button>

      <button class="color"
        data-color="#FFFF00"
        style="background:#FFFF00"
        aria-label="Yellow"></button>
    </div>

    <canvas id="canvas" width="384" height="180"></canvas>

    <div class="toolbar">
      <button id="undo">Undo</button>
      <button id="clear">Clear screen</button>
      <button id="save">Save project</button>
      <button id="export">Export PNG</button>
    </div>

    <p id="status">Ready to draw!</p>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    const W = 384;
    const H = 180;

    let screen = 0;
    let tool = "pen";
    let color = "#000000";
    let drawing = false;
    let start = null;
    let previous = null;

    const screens = [null, null, null];
    const history = [[], [], []];

    function blankCanvas() {
      const c = document.createElement("canvas");
      c.width = W;
      c.height = H;

      const cctx = c.getContext("2d");
      cctx.fillStyle = "#FFFFFF";
      cctx.fillRect(0, 0, W, H);

      return c;
    }

    function getScreen() {
      if (!screens[screen]) {
        screens[screen] = blankCanvas();
      }
      return screens[screen];
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(getScreen(), 0, 0);
    }

    function point(e) {
      const r = canvas.getBoundingClientRect();

      return {
        x: Math.max(0, Math.min(W - 1,
          Math.floor((e.clientX - r.left) * W / r.width))),
        y: Math.max(0, Math.min(H - 1,
          Math.floor((e.clientY - r.top) * H / r.height)))
      };
    }

    function remember() {
      history[screen].push(getScreen().toDataURL());

      if (history[screen].length > 30) {
        history[screen].shift();
      }
    }

    function line(a, b, stroke, width = 2) {
      const c = getScreen().getContext("2d");

      c.strokeStyle = stroke;
      c.lineWidth = width;
      c.lineCap = "round";

      c.beginPath();
      c.moveTo(a.x, a.y);
      c.lineTo(b.x, b.y);
      c.stroke();
    }

    function rectangle(a, b) {
      const c = getScreen().getContext("2d");

      c.strokeStyle = color;
      c.lineWidth = 2;
      c.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
    }

    document.querySelectorAll("[data-screen]").forEach(button => {
      button.addEventListener("click", () => {
        screen = Number(button.dataset.screen);

        document.querySelectorAll("[data-screen]").forEach(b =>
          b.classList.toggle("active", b === button)
        );

        render();
        status.textContent = "Editing Screen " + (screen + 1);
      });
    });

    document.querySelectorAll("[data-tool]").forEach(button => {
      button.addEventListener("click", () => {
        tool = button.dataset.tool;

        document.querySelectorAll("[data-tool]").forEach(b =>
          b.classList.toggle("active", b === button)
        );

        status.textContent = "Tool: " + tool;
      });
    });

    document.querySelectorAll("[data-color]").forEach(button => {
      button.addEventListener("click", () => {
        color = button.dataset.color;

        document.querySelectorAll("[data-color]").forEach(b =>
          b.classList.toggle("active", b === button)
        );

        status.textContent = "Selected color: " + color;
      });
    });

    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();

      const p = point(e);

      if (tool === "text") {
        const text = prompt("Enter your text:");
        if (!text) return;

        remember();

        const c = getScreen().getContext("2d");
        c.fillStyle = color;
        c.font = "16px Arial";
        c.textBaseline = "top";
        c.fillText(text, p.x, p.y);

        render();
        return;
      }

      remember();
      drawing = true;
      start = p;
      previous = p;

      canvas.setPointerCapture(e.pointerId);

      if (tool === "pen" || tool === "eraser") {
        line(p, p, tool === "eraser" ? "#FFFFFF" : color,
          tool === "eraser" ? 10 : 2);
        render();
      }
    });

    canvas.addEventListener("pointermove", e => {
      if (!drawing) return;

      e.preventDefault();
      const p = point(e);

      if (tool === "pen" || tool === "eraser") {
        line(previous, p,
          tool === "eraser" ? "#FFFFFF" : color,
          tool === "eraser" ? 10 : 2);

        previous = p;
        render();
      }
    });

    function finish(e) {
      if (!drawing) return;

      drawing = false;
      const p = point(e);

      if (tool === "line") {
        line(start, p, color);
      }

      if (tool === "rect") {
        rectangle(start, p);
      }

      render();
      status.textContent = "Design updated!";
    }

    canvas.addEventListener("pointerup", finish);
    canvas.addEventListener("pointercancel", finish);

    document.getElementById("undo").addEventListener("click", () => {
      const previousImage = history[screen].pop();

      if (!previousImage) {
        status.textContent = "Nothing to undo.";
        return;
      }

      const img = new Image();

      img.onload = () => {
        screens[screen] = blankCanvas();
        screens[screen].getContext("2d").drawImage(img, 0, 0);
        render();
      };

      img.src = previousImage;
      status.textContent = "Undo complete.";
    });

    document.getElementById("clear").addEventListener("click", () => {
      if (!confirm("Clear this screen?")) return;

      remember();
      screens[screen] = blankCanvas();
      render();
      status.textContent = "Screen cleared.";
    });

    document.getElementById("save").addEventListener("click", () => {
      const project = {
        width: W,
        height: H,
        screens: screens.map(s =>
          (s || blankCanvas()).toDataURL("image/png")
        )
      };

      try {
        localStorage.setItem(
          "quadColorBadgeProject",
          JSON.stringify(project)
        );
        status.textContent = "Project saved in this browser!";
      } catch (error) {
        status.textContent = "Could not save. Export your screens instead.";
      }
    });

    document.getElementById("export").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "badge-screen-" + (screen + 1) + ".png";
      link.href = getScreen().toDataURL("image/png");
      link.click();

      status.textContent = "PNG downloaded!";
    });

    // Restore a previously saved project.
    try {
      const saved = localStorage.getItem("quadColorBadgeProject");

      if (saved) {
        const project = JSON.parse(saved);

        if (project.screens && project.screens.length === 3) {
          project.screens.forEach((data, i) => {
            const img = new Image();

            img.onload = () => {
              screens[i] = blankCanvas();
              screens[i].getContext("2d").drawImage(img, 0, 0);
              render();
            };

            img.src = data;
          });
        }
      }
    } catch (error) {
      console.log("No saved project could be restored.");
    }

    render();
  </script>
</body>
</html>
